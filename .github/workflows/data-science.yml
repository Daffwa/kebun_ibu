# Tes pipeline harga buah (data-science/). Situs Next.js tidak ikut.
name: data-science

on:
  push:
    branches: [main]
    paths: ["data-science/**", ".github/workflows/data-science.yml"]
  pull_request:
    branches: [main]
    paths: ["data-science/**", ".github/workflows/data-science.yml"]

defaults:
  run:
    working-directory: data-science

jobs:
  tes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: data-science/requirements.txt
      - run: pip install -r requirements.txt
      # semua tes memakai fixture di tests/fixtures, tanpa internet
      - run: python -m pytest -q
